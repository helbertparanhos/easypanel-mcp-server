name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node é ">=18" — o mínimo declarado e as LTS seguintes.
        node: ["18", "20", "22"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Testes
        run: npm test

      # O que o npm publish empacotaria. Pega arquivo faltando em `files`
      # antes de virar um pacote quebrado no registry.
      - name: Conferir conteúdo do pacote
        if: matrix.node == '22'
        run: npm pack --dry-run
